---
# Should be stopped / destroyed
# - include_tasks: start-vm.yml
#   vars:
#     vm_instance_name: "{{ cluster_name }}-bootstrap"

- name: Start master VM's
  ansible.builtin.include_tasks: start-vm.yml
  vars:
    vm_instance_name: "{{ cluster_name }}-master-{{ item }}"
  with_sequence: start=0 end="{{ master_count|int - 1 }}" stride=1

- name: Start compute VM's
  ansible.builtin.include_tasks: start-vm.yml
  vars:
    vm_instance_name: "{{ cluster_name }}-compute-{{ item }}"
  with_sequence: start=0 end="{{ compute_count|int - 1 if compute_count|int > 0 else 0 }}" stride=1
  when: compute_count > 0

- name: Start OpenShift 4 load balancer
  ansible.builtin.import_role:
    name: openshift-4-loadbalancer
    tasks_from: start.yml
  vars:
    lb_name: "openshift-4-loadbalancer-{{ cluster_name }}"
  tags:
    lb

###############################################################################
# Wait for the cluster to actually come back.
#
# Starting the VMs takes about twelve seconds; the cluster is not usable for
# considerably longer. Without this the play reported success while every
# node was still NotReady and the API was refusing connections, which is
# exactly the wrong answer after a power cut - the one time someone needs to
# know whether the cluster really came back.
#
# Measured on this host after a full stop/start of a 6-node 4.22 cluster:
#   12s   VMs running
#   73s   all nodes Ready, all ClusterOperators healthy
#   157s  workload fully restored (214 running pods, matching the baseline)
#
# Three separate gates, because each can pass while the next is still false -
# operators reported healthy at 73s when fewer than half the pods were back.
###############################################################################

- name: Verify the cluster after starting
  when: start_cluster_wait | default(true)
  block:

    - name: Locate openshift client for {{ openshift_version }}
      ansible.builtin.stat:
        path: "/opt/openshift-client-{{ openshift_version }}/oc"
      register: start_oc_stat

    - name: Skip verification if the openshift client is missing
      ansible.builtin.debug:
        msg: >-
          /opt/openshift-client-{{ openshift_version }}/oc not found - VMs
          were started but the cluster was not verified. Check it by hand.
      when: not start_oc_stat.stat.exists

    - name: Wait for the cluster to come back
      when: start_oc_stat.stat.exists
      vars:
        start_oc: "/opt/openshift-client-{{ openshift_version }}/oc --kubeconfig {{ openshift_install_dir }}/auth/kubeconfig"
      block:

        - name: Wait for the API to answer
          ansible.builtin.command: "{{ start_oc }} get --raw /readyz"
          register: start_api
          until: start_api.rc == 0
          retries: "{{ start_cluster_api_retries }}"
          delay: 10
          changed_when: false

        - name: Wait for every node to report Ready
          ansible.builtin.command: "{{ start_oc }} get nodes -o json"
          register: start_nodes
          until:
            - start_nodes.rc == 0
            - (start_nodes.stdout | from_json)
              | json_query("items[?status.conditions[?type=='Ready' && status!='True']].metadata.name") | length == 0
            - (start_nodes.stdout | from_json)['items'] | length == (master_count | int) + (compute_count | int)
          retries: "{{ start_cluster_node_retries }}"
          delay: 10
          changed_when: false

        - name: Wait for every ClusterOperator to be healthy
          ansible.builtin.command: "{{ start_oc }} get clusteroperators -o json"
          register: start_co
          until:
            - start_co.rc == 0
            - (start_co.stdout | from_json)
              | json_query("items[?status.conditions[?type=='Available' && status=='False']].metadata.name") | length == 0
            - (start_co.stdout | from_json)
              | json_query("items[?status.conditions[?type=='Degraded' && status=='True']].metadata.name") | length == 0
          retries: "{{ start_cluster_operator_retries }}"
          delay: 15
          changed_when: false

        - name: Cluster is back
          ansible.builtin.debug:
            msg: >-
              Cluster is back: all {{ (master_count | int) + (compute_count | int) }}
              nodes Ready and no ClusterOperator degraded or unavailable.
              Workloads may take another minute or two to finish rescheduling -
              check `oc get pods -A` if something specific matters to you.
