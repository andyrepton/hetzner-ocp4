---
# Should be stopped / destroyed
# - include_tasks: stop-vm.yml
#   vars:
#     vm_instance_name: "{{ cluster_name }}-bootstrap"

- name: Init empty vms
  ansible.builtin.set_fact:
    vms: []

- name: Add masters to vms
  ansible.builtin.set_fact:
    vms:  "{{ vms + [ cluster_name + '-master-' + item  ] }}"
  with_sequence: start=0 end="{{ master_count|int - 1 }}" stride=1

- name: Add compute to vms
  ansible.builtin.set_fact:
    vms: "{{ vms + [ cluster_name + '-compute-' + item  ] }}"
  with_sequence: start=0 end="{{ compute_count|int - 1 if compute_count|int > 0 else 0 }}" stride=1
  when: compute_count > 0

- name: "Shutdown VM"
  community.libvirt.virt:
    command: shutdown
    name: "{{ item }}"
  ignore_errors: yes
  with_items: "{{ vms }}"

# 60 x 10s rather than 10 x 10s. A node that is busy, or has a unit that is
# slow to stop, can take several minutes to finish an ACPI shutdown: measured
# on a 6-node 4.22 cluster the last VMs did not reach "shut off" until 161s,
# and one worker on the same host once took over twelve minutes. The old 100s
# ceiling failed the play while the guests were shutting down perfectly
# normally, leaving a half-stopped cluster and a confusing error.
- name: "Check VM state"
  community.libvirt.virt:
    name: "{{ item }}"
    command: status
  register: result
  until: result.status == 'shutdown'
  delay: 10
  retries: 60
  with_items: "{{ vms }}"

- name: Stop OpenShift 4 load balancer
  ansible.builtin.import_role:
    name: openshift-4-loadbalancer
    tasks_from: stop.yml
  vars:
    lb_name: "openshift-4-loadbalancer-{{ cluster_name }}"
  tags:
    lb
