---
artifacts_dir: "{{ playbook_dir }}/.."
openshift_install_dir: "{{ artifacts_dir }}/{{ cluster_name }}"
ssh_public_key_location: ~/.ssh/id_rsa

vn_subnet: "192.168.50.0"
vn_name: "openshift-4-cluster"
vn_internal_domain: "compute.local"
vn_public_domain: "{{ cluster_name }}.{{ public_domain }}"

#
ip_families:
  - IPv4

listen_address: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] | default('') }}"
listen_address_ipv6: "{{ hostvars[inventory_hostname]['ansible_default_ipv6']['address'] | default('') }}"

# Default: qcow2
# For more performance use LVM
vm_storage_backend: qcow2
# Only necessary for LVM, ignored by qcow but should be '/var/lib/libvirt/images/'
vm_storage_backend_location:

master_count: 3
master_vcpu: 4
master_memory_size: 16384
master_memory_unit: 'MiB'
# qemu-img image size specified.
#   You may use k, M, G, T, P or E suffixe
master_root_disk_size: '120G'

compute_count: 3
compute_vcpu: 2
compute_memory_size: 8192
compute_memory_unit: 'MiB'
# qemu-img image size specified.
#   You may use k, M, G, T, P or E suffixe
compute_root_disk_size: '120G'

fips: false

vm_autostart: false

# Important: OpenShift version must match to RHEL CoreOS version!

# Reference to OpenShift stable version
openshift_version: stable
openshift_mirror: "https://mirror.openshift.com"
openshift_location: " {{ openshift_mirror }}/pub/openshift-v4/clients/ocp/{{ openshift_version }}"

# Example for dev-pre/candidate
# openshift_version: candidate
# openshift_location: " {{ openshift_mirror }}/pub/openshift-v4/clients/ocp-dev-preview/{{ openshift_version }}"

openshift_install_command: "/usr/local/bin/openshift-install"

opm_download_url: "{{ openshift_location }}/opm-linux-rhel9.tar.gz"

# Path to store coreos image
coreos_path: /var/lib/libvirt/images

certificates_dir: "{{ artifacts_dir }}/certificate"
certficate_fullchain: "{{ certificates_dir }}/{{ cluster_name }}.{{ public_domain }}/fullchain.crt"
certficate_key: "{{ certificates_dir }}/{{ cluster_name }}.{{ public_domain }}/cert.key"
# Default production directory
# Production directory: https://acme-v02.api.letsencrypt.org/directory
# Staging directory: "https://acme-staging-v02.api.letsencrypt.org/directory"
letsencrypt_directory: "https://acme-v02.api.letsencrypt.org/directory"
# By default letsencrypt is enabled.
letsencrypt_disabled: false
# helm
helm_cli_location: "{{ openshift_mirror }}/pub/openshift-v4/clients/helm/latest/helm-linux-amd64"

butane_cli_location: "{{ openshift_mirror }}/pub/openshift-v4/clients/butane/latest/butane-amd64"

# set to false if using OKD as it does not provide oc-mirror binary
download_oc_mirror: true

# NFS Storage
#  storage_nfs do not support multi cluster support, it overwrites the
#  /etc/exports
storage_nfs: false
storage_nfs_path_prefix: '/var/lib/libvirt/images'
storage_nfs_target_namespace: openshift-nfs-provisioner

# sdn plugin
sdn_plugin_name: OVNKubernetes

# Master node schedulable
masters_schedulable: true

add_ons_enabled: false

# Internal use only, to use an adjusted ignition config.
ignition_filename_appendix: ""

# --- Maintenance settings (used by tasks/maintenance.yml / 09-maintenance.yml) ---
# Run `fstrim -a` inside each running node. The domains use discard='unmap',
# so this propagates through and shrinks the backing qcow2 on the host -
# RHCOS does not enable fstrim.timer, so nothing else ever does it.
maintenance_fstrim: true
# Run `crictl rmi --prune` on each node. Off by default: kubelet already
# garbage-collects images above its 85% threshold, and pruning forces a
# re-pull of anything not currently running. Worth enabling before an
# upgrade, which pulls a whole new release payload onto every node.
maintenance_prune_images: false
# Delete Pending CSRs whose system:node:<name> subject names a node that is
# no longer in the cluster.
maintenance_clean_csrs: true
# How the maintenance tasks reach the nodes. virsh domfstrim would avoid SSH
# entirely but needs the QEMU guest agent, which these domains do not have.
maintenance_ssh_key: "~/.ssh/id_rsa"
maintenance_ssh_timeout: 10
# Install a systemd timer that runs 09-maintenance.yml on a schedule. Off by
# default - pass -e maintenance_install_timer=true once to set it up. Nothing
# else in this repo ever reclaims qcow2 space, so without it the images grow
# until the filesystem fills.
maintenance_install_timer: false
# systemd OnCalendar expression. Weekly on Sunday at 03:00 by default.
maintenance_timer_schedule: "Sun *-*-* 03:00:00"
# Jitter, so a host running several clusters does not trim them all at once.
maintenance_timer_randomized_delay: "30m"
# Upper bound on a single maintenance run.
maintenance_timer_timeout: "45min"
