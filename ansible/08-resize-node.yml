---
# Resizes CPU and/or memory for one or more existing nodes. See
# docs/operations/resizing-a-node.md. Disk resize is out of scope.
#
# Usage:
#   ./ansible/08-resize-node.yml -e '{"resize_node_names": ["compute-0"], "resize_node_memory_size": 16384}'
#   ./ansible/08-resize-node.yml -e '{"resize_node_names": ["compute-0"], "resize_node_vcpu": 4}' --check
- name: Resize node CPU and/or memory
  hosts: host
  gather_facts: true
  vars_files:
    - ../cluster.yml

  tasks:
    - name: Resize node(s)
      ansible.builtin.import_role:
        name: openshift-4-cluster
        tasks_from: resize-node.yml
